name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libxrender1 \
            libxext6 \
            libsm6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            numpy \
            scipy \
            networkx \
            sympy \
            lcapy \
            pyvista \
            scikit-learn \
            torch \
            lightning

      - name: Run Python unit tests
        run: python tests/test_sonification.py

  javascript-tests:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run classifier tests
        run: node tests/test_classifier.mjs

      - name: Run audio tests
        if: success() || failure()
        run: node tests/test_audio.mjs
